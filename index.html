<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKK - Добро Пожаловать</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; 
            --dark: #1a1a2e; 
            --white: #ffffff; 
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }

        /* --- 1. LOADER ASOSIY FONI --- */
        #loader { 
            position: fixed; 
            width: 100%; 
            height: 100vh; 
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 3000; 
            overflow: hidden;
            transition: opacity 1s ease-in-out; 
        }

        /* --- 2. YOG'AYOTGAN BARGLAR --- */
        .leaves-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .leaf {
            position: absolute;
            background-color: var(--primary);
            opacity: 0.6;
            border-radius: 2px 12px 2px 12px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* --- 3. MATNLAR DIZAYNI --- */
        .loader-content { 
            text-align: center; 
            position: relative; 
            z-index: 10; 
        }

        .welcome-text {
            color: var(--white);
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .welcome-text span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-100px);
            filter: blur(10px);
            animation: slideInLeft 0.8s forwards;
        }

        @keyframes slideInLeft {
            to { 
                opacity: 1; 
                transform: translateX(0); 
                filter: blur(0);
            }
        }

        .main-title {
            display: none;
            animation: fadeInScale 1.2s forwards;
        }

        .main-title h1 {
            color: var(--primary);
            font-size: 3.2rem;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
            line-height: 1.2;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.5); filter: blur(20px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        /* --- 4. IKONKALAR --- */
        .icon-group {
            margin-top: 40px;
            font-size: 2.8rem;
            color: var(--white);
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .icon-group i {
            animation: iconPulse 2s infinite ease-in-out;
            opacity: 0.5;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; color: var(--primary); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="leaves-container" id="leavesTarget"></div>

        <div class="loader-content">
            <div class="welcome-text" id="text1">
                Добро Пожаловать
            </div>

            <div class="main-title" id="text2">
                <h1>Тепличный Комплекс<br>Камчатский</h1>
                
                <div class="icon-group">
                    <i class="fas fa-seedling"></i>
                    <i class="fas fa-leaf"></i>
                    <i class="fas fa-tree"></i>
                    <i class="fas fa-cloud-sun-rain"></i>
                    <i class="fas fa-temperature-high"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" style="padding: 50px; text-align: center;">
        <h2>Asosiy sahifa yuklandi!</h2>
        <p>Barcha hisob-kitoblar va kartalar shu yerda ko'rinadi.</p>
    </div>

    <script>
        window.onload = () => {
            const text1 = document.getElementById('text1');
            const strText = text1.textContent.trim();
            text1.textContent = "";

            // 1. Matnni harflarga bo'lish va animatsiya berish
            for(let i=0; i < strText.length; i++) {
                let char = strText[i] === " " ? "&nbsp;" : strText[i];
                text1.innerHTML += `<span style="animation-delay: ${i * 0.07}s">${char}</span>`;
            }

            // 2. Barglarni yog'dirish
            createLeaves();

            // 3. Matnlarni almashtirish mantiqi
            setTimeout(() => {
                text1.style.transition = "all 1s ease";
                text1.style.opacity = "0";
                text1.style.transform = "translateY(-50px)";
                
                setTimeout(() => {
                    text1.classList.add('hidden');
                    const text2 = document.getElementById('text2');
                    text2.style.display = 'block';
                }, 1000);
            }, 4000);

            // 4. Loader-ni yopish
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    // Bu yerda renderAll() yoki boshqa funksiyalarni chaqirishingiz mumkin
                }, 1000);
            }, 8500);
        };

        // BARGLAR YARATISH
        function createLeaves() {
            const target = document.getElementById('leavesTarget');
            const count = 40;

            for (let i = 0; i < count; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                
                const size = Math.random() * 12 + 8 + 'px';
                leaf.style.width = size;
                leaf.style.height = size;
                leaf.style.left = Math.random() * 100 + '%';
                
                const duration = Math.random() * 4 + 4 + 's';
                leaf.style.animationDuration = duration;
                leaf.style.animationDelay = Math.random() * 5 + 's';

                target.appendChild(leaf);
            }
        }
    </script>
</body>
</html>
