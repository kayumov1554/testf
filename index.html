<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKK Intro PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; /* Yagona yashil rang */
            --white: #ffffff; 
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
        }

        #loader { 
            position: fixed; 
            width: 100%; height: 100vh; 
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%); 
            display: flex; align-items: center; justify-content: center; 
            z-index: 3000; overflow: hidden;
            transition: opacity 1s ease-in-out; 
        }

        /* --- YOG'AYOTGAN BARGLAR --- */
        .leaves-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .leaf {
            position: absolute;
            background-color: var(--primary);
            opacity: 0.4;
            border-radius: 2px 12px 2px 12px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* --- MATNLAR --- */
        .loader-content { 
            text-align: center; 
            position: relative; 
            z-index: 10; 
            width: 100%;
        }

        .anim-text {
            font-weight: 800;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 10px;
            color: var(--primary); /* Ikkala matn ham yashil */
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
        }

        #text1 { color: var(--white); font-size: 1.6rem; } /* Faqat birinchi matn oq */

        .title-top { font-size: 1.8rem; margin-bottom: 5px; }
        .title-bottom { font-size: 2.3rem; text-transform: uppercase; }

        .anim-text span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-40px);
            filter: blur(5px);
            animation: slideInLeft 0.5s forwards;
        }

        @keyframes slideInLeft {
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }

        /* --- IKONKALAR --- */
        #icons-container {
            margin-top: 30px;
            font-size: 2.2rem;
            color: var(--white);
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
        }

        #icons-container.show {
            opacity: 1;
            visibility: visible;
        }

        .icon-group i {
            animation: iconPulse 2s infinite ease-in-out;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); color: var(--white); }
            50% { transform: scale(1.2); color: var(--primary); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="leaves-container" id="leavesTarget"></div>

        <div class="loader-content">
            <div class="anim-text" id="text1">Добро Пожаловать</div>

            <div id="text2-container" class="hidden">
                <div class="anim-text title-top" id="text2-part1">Тепличный Комплекс</div>
                <div class="anim-text title-bottom" id="text2-part2">Камчатский</div>
            </div>

            <div id="icons-container" class="icon-group">
                <i class="fas fa-seedling"></i>
                <i class="fas fa-leaf"></i>
                <i class="fa-solid fa-pepper-hot"></i>
                <i class="fa-solid fa-lemon"></i>
                <i class="fas fa-tree"></i>
            </div>
        </div>
    </div>

    <script>
        // Harflarni animatsiya qilish funksiyasi
        function animateChars(elementId, callback) {
            const el = document.getElementById(elementId);
            const strText = el.textContent.trim();
            el.textContent = "";
            el.style.display = "flex";

            strText.split("").forEach((char, i) => {
                let span = document.createElement("span");
                span.innerHTML = char === " " ? "&nbsp;" : char;
                span.style.animationDelay = (i * 0.05) + "s";
                el.appendChild(span);
                
                // Oxirgi harf tugaganda keyingi bosqichga o'tish
                if (i === strText.length - 1 && callback) {
                    span.addEventListener('animationend', callback, {once: true});
                }
            });
        }

        window.onload = () => {
            createLeaves();

            // 1-bosqich: Dobro pojalovat
            animateChars('text1');

            // 2-bosqich: Matn almashishi
            setTimeout(() => {
                const t1 = document.getElementById('text1');
                t1.style.transition = "opacity 0.6s";
                t1.style.opacity = "0";
                
                setTimeout(() => {
                    t1.style.display = 'none';
                    const container2 = document.getElementById('text2-container');
                    container2.classList.remove('hidden');
                    
                    // Ketma-ket va bir xil rangda yozish
                    animateChars('text2-part1', () => {
                        animateChars('text2-part2', () => {
                            // Ikonkalarni ko'rsatish
                            document.getElementById('icons-container').classList.add('show');
                        });
                    });
                }, 600);
            }, 3000);

            // Loader yopilishi
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 1000);
            }, 9000);
        };

        function createLeaves() {
            const target = document.getElementById('leavesTarget');
            for (let i = 0; i < 40; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.style.width = leaf.style.height = (Math.random() * 8 + 5) + 'px';
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDuration = (Math.random() * 3 + 4) + 's';
                leaf.style.animationDelay = Math.random() * 5 + 's';
                target.appendChild(leaf);
            }
        }
    </script>
</body>
</html>
