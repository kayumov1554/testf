<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKK - Добро Пожаловать</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; 
            --dark: #1a1a2e; 
            --white: #ffffff; 
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* --- LOADER ASOSIY FONI --- */
        #loader { 
            position: fixed; 
            width: 100%; 
            height: 100vh; 
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 3000; 
            overflow: hidden;
            transition: opacity 1s ease-in-out; 
        }

        /* --- YOG'AYOTGAN BARGLAR --- */
        .leaves-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .leaf {
            position: absolute;
            background-color: var(--primary);
            opacity: 0.5;
            border-radius: 2px 12px 2px 12px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* --- MATNLAR DIZAYNI --- */
        .loader-content { 
            text-align: center; 
            position: relative; 
            z-index: 10; 
            width: 90%;
        }

        /* Umumiy harflar animatsiyasi stili */
        .anim-text {
            color: var(--white);
            font-size: 1.8rem; /* Ekran sig'ishi uchun optimal o'lcham */
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .anim-text span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-50px);
            filter: blur(5px);
            animation: slideInLeft 0.6s forwards;
        }

        @keyframes slideInLeft {
            to { 
                opacity: 1; 
                transform: translateX(0); 
                filter: blur(0);
            }
        }

        /* Ikkinchi matn yashil rangda */
        #text2.anim-text {
            color: var(--primary);
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
        }

        /* --- IKONKALAR --- */
        .icon-group {
            margin-top: 30px;
            font-size: 2.2rem;
            color: var(--white);
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 2s; /* Matndan keyin chiqadi */
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .icon-group i {
            animation: iconPulse 2s infinite ease-in-out;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); color: var(--white); }
            50% { transform: scale(1.2); color: var(--primary); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="leaves-container" id="leavesTarget"></div>

        <div class="loader-content">
            <div class="anim-text" id="text1">Добро Пожаловать</div>

            <div class="anim-text hidden" id="text2">Тепличный Комплекс Камчатский</div>

            <div class="icon-group id="icons">
                <i class="fas fa-seedling"></i> <i class="fas fa-leaf"></i>     <i class="fa-solid fa-apple-whole"></i> <i class="fa-solid fa-lemon"></i> <i class="fas fa-tree"></i>     </div>
        </div>
    </div>

    <script>
        function animateChars(elementId) {
            const el = document.getElementById(elementId);
            const strText = el.textContent.trim();
            el.textContent = "";
            el.classList.remove('hidden');

            for(let i=0; i < strText.length; i++) {
                let char = strText[i] === " " ? "&nbsp;" : strText[i];
                let delay = i * 0.05;
                el.innerHTML += `<span style="animation-delay: ${delay}s">${char}</span>`;
            }
        }

        window.onload = () => {
            // 1. Birinchi matnni boshlash
            animateChars('text1');
            
            // 2. Barglarni yaratish
            createLeaves();

            // 3. Matnlarni almashtirish (3 sekunddan keyin)
            setTimeout(() => {
                const t1 = document.getElementById('text1');
                t1.style.transition = "opacity 0.8s";
                t1.style.opacity = "0";
                
                setTimeout(() => {
                    t1.style.display = 'none';
                    // Ikkinchi matnni xuddi birinchi kabi animatsiya bilan chiqarish
                    animateChars('text2');
                }, 800);
            }, 3500);

            // 4. Loader-ni butunlay yopish (8 sekundda)
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 1000);
            }, 8000);
        };

        function createLeaves() {
            const target = document.getElementById('leavesTarget');
            for (let i = 0; i < 40; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                const size = Math.random() * 10 + 5 + 'px';
                leaf.style.width = size;
                leaf.style.height = size;
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDuration = Math.random() * 3 + 4 + 's';
                leaf.style.animationDelay = Math.random() * 5 + 's';
                target.appendChild(leaf);
            }
        }
    </script>
</body>
</html>
